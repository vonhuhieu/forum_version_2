server.port=8080

# ===================================================================
# Database Configuration for Local MySQL inside VPS Docker
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/forum_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# File Upload Configuration (Allow larger uploads)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Local File Upload Provider (Save files directly to VPS disk)
app.upload.provider=local
app.upload.local-dir=uploads

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expirationMs=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS Configuration (Allow frontend on Vercel with custom domain)
app.cors.allowed-origins=https://htxslvn.com,https://www.htxslvn.com

# OpenSearch Configuration (Local OpenSearch inside VPS Docker)
opensearch.uris=http://localhost:9200
opensearch.username=
opensearch.password=
