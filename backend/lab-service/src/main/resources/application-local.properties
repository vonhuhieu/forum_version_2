server.port=8081
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Local fallback defaults
app.jwt.secret=${APP_JWT_SECRET:local_dev_jwt_secret_must_be_at_least_256_bits_long_for_hmac_sha256}
app.jwt.expirationMs=86400000

spring.data.mongodb.uri=${LAB_MONGO_URI:mongodb://localhost:27017/lab_db}

# LLM Providers Configuration (Local defaults)
lab.llm.gemini.api-key=${LAB_GEMINI_API_KEY:}
lab.llm.gemini.model=${LAB_GEMINI_MODEL:gemini-1.5-flash}
lab.llm.gemini.base-url=${LAB_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}

lab.llm.groq.api-key=${LAB_GROQ_API_KEY:}
lab.llm.groq.model=${LAB_GROQ_MODEL:llama-3.3-70b-versatile}
lab.llm.groq.base-url=${LAB_GROQ_BASE_URL:https://api.groq.com/openai/v1}

lab.llm.openrouter.api-key=${LAB_OPENROUTER_API_KEY:}
lab.llm.openrouter.model=${LAB_OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}
lab.llm.openrouter.base-url=${LAB_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
