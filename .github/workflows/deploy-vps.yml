name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Copy JAR to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/var/www/forum/"
          strip_components: 2

      - name: Rename and Restart Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            mv -f /var/www/forum/backend-0.0.1-SNAPSHOT.jar /var/www/forum/app.jar
            sed -i 's|ExecStart=/usr/bin/java -Dspring.profiles.active=prod -jar|ExecStart=/usr/bin/java -Dspring.profiles.active=prod -Duser.timezone=Asia/Ho_Chi_Minh -jar|' /etc/systemd/system/forum-backend.service
            systemctl daemon-reload
            systemctl restart forum-backend
