name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Copy JAR to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/var/www/forum/"
          strip_components: 2

      - name: Rename and Restart Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            mv -f /var/www/forum/backend-0.0.1-SNAPSHOT.jar /var/www/forum/app.jar
            cd /var/www/forum
            docker-compose up -d backend
            docker-compose restart backend

      - name: Wait for Backend to Start
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "Waiting for backend to be ready..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "Backend is up!"
                exit 0
              fi
              echo "Attempt $i/24 - not ready yet, waiting 5s..."
              sleep 5
            done
            echo "Backend failed to start!"
            exit 1

      - name: Reindex OpenSearch after Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "Triggering OpenSearch reindex..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "http://localhost:8080/api/search/reindex")
            if [ "$RESPONSE" = "200" ]; then
              echo "Reindex triggered successfully (HTTP 200)"
            else
              echo "Reindex returned HTTP $RESPONSE — check backend logs"
              exit 1
            fi
