name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  # Cho phép vps-bootstrap.yml gọi lại workflow này sau khi bootstrap xong
  workflow_call:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Copy JAR to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/var/www/forum/"
          strip_components: 2

      - name: Copy docker-compose.yml to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "docker-compose.yml"
          target: "/var/www/forum/"

      - name: Rename and Restart Backend via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "=== Current Directory and Files ==="
            pwd
            ls -la /var/www/forum/
            mv -f /var/www/forum/backend-0.0.1-SNAPSHOT.jar /var/www/forum/app.jar
            cd /var/www/forum
            echo "=== Running docker compose up -d ==="
            docker compose up -d
            echo "=== Restarting backend ==="
            docker compose restart backend
            echo "=== docker compose status ==="
            docker compose ps

      - name: Wait for Backend to Start
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "Waiting for backend to be ready..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8080/api/settings/public > /dev/null 2>&1; then
                echo "Backend is up!"
                exit 0
              fi
              echo "Attempt $i/24 - not ready yet, waiting 5s..."
              sleep 5
            done
            echo "Backend failed to start!"
            echo "=== Docker Container Status ==="
            docker ps -a
            echo "=== Backend Container Logs ==="
            docker logs forum-backend --tail 100
            echo "=== MySQL Container Logs ==="
            docker logs $(docker ps -aq -f name=mysql | head -n 1) --tail 100 || true
            echo "=== OpenSearch Container Logs ==="
            docker logs $(docker ps -aq -f name=opensearch | head -n 1) --tail 100 || true
            exit 1

      - name: Reindex OpenSearch after Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "Triggering OpenSearch reindex..."
            # Chạy POST request bằng wget từ bên trong container để giữ IP nguồn là 127.0.0.1 (Local), tránh lỗi 401 do NAT của mạng Docker
            docker exec forum-backend wget -qO- --post-data="" http://localhost:8080/api/search/reindex
