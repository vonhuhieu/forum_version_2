name: Deploy Lab Service to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/lab-service/**'
      - '.github/workflows/deploy-lab.yml'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Lab Service with Maven
        run: |
          cd backend/lab-service
          mvn clean package -DskipTests

      - name: Copy Lab JAR to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/lab-service/target/lab-service.jar"
          target: "/var/www/forum/"
          strip_components: 3

      - name: Copy docker-compose.yml to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "docker-compose.yml"
          target: "/var/www/forum/"

      - name: Restart Lab Service Container via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/forum
            echo "=== Khởi động cụm Mongo và Lab Service ==="
            docker compose up -d mongo lab-service
            echo "=== docker compose status ==="
            docker compose ps
