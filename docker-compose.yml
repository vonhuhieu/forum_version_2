version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: forum-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: forum_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: forum-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - network.publish_host=127.0.0.1
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: always

  backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: forum-backend
    working_dir: /app
    volumes:
      - ./app.jar:/app/app.jar
      - ./uploads:/app/uploads
      - .env:/app/.env
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/forum_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      - OPENSEARCH_URIS=http://opensearch:9200
    command: java -Dspring.profiles.active=prod -Duser.timezone=Asia/Ho_Chi_Minh -jar app.jar
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - mysql
      - opensearch
    restart: always

volumes:
  mysql_data:
  opensearch_data:
